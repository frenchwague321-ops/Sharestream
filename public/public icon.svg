<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- TV/Monitor frame -->
  <rect x="88" y="104" width="336" height="240" rx="36" fill="#111827" stroke="url(#blueGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Screen glossy overlay -->
  <path d="M 100 120 L 412 120 C 418 120 422 124 422 130 L 422 200 L 100 240 Z" fill="#FFFFFF" fill-opacity="0.04"/>

  <!-- Streaming Waves / Signal -->
  <path d="M 180 224 C 180 224 212 180 256 180 C 300 180 332 224 332 224" fill="none" stroke="#60A5FA" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Play triangle symbol -->
  <polygon points="236,196 296,224 236,252" fill="url(#accentGrad)"/>

  <!-- Stand base -->
  <rect x="236" y="344" width="40" height="44" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="4"/>
  <rect x="176" y="388" width="160" height="20" rx="10" fill="url(#blueGrad)"/>

  <!-- Small power dot indicator -->
  <circle cx="396" cy="324" r="5" fill="#10B981"/>
</svg>